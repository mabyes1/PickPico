plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mcpocket.poc'
    compileSdk 35

    signingConfigs {
        debug {
            storeFile file('C:/Users/ken/.android/debug.keystore')
        }
    }

    defaultConfig {
        applicationId 'com.mcpocket.poc'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.6.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}
