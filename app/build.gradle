plugins {
    id 'com.android.application'
}

// Same Node 18.20.4 sources, rebuilt from upstream's 16 KB alignment branch.
def nodeMobileVersion = '18.20.4-capawesome.1'
def nodeMobileSha256 = '1B3C7979C81AEC89A7F51B29AF1F4875A5D637727AD6E2C392CDF2E127715DA9'
def nodeMobileRoot = layout.buildDirectory.dir("generated/node-mobile-${nodeMobileVersion}").get().asFile
def nodeMobileZip = layout.buildDirectory.file("downloads/nodejs-mobile-v${nodeMobileVersion}-android.zip").get().asFile
def adbEngineVersion = 'v36.0.1-baklava-16kb-pair'
def adbEngineSha256 = 'B73CDFB58E85ED7EF3DC95E80A5F2F9B99EFDA6B3FA5F7353A1337E2F09D8818'
def adbEngineRoot = layout.buildDirectory.dir("generated/picoadb-jni-${adbEngineVersion}").get().asFile
def adbEngineFile = new File(adbEngineRoot, 'arm64-v8a/libadb.so')
def pickpicoDebugKeystore = providers.gradleProperty('pickpicoDebugKeystore').orNull

tasks.register('prepareNodeMobileRuntime') {
    outputs.file(new File(nodeMobileRoot, 'bin/arm64-v8a/libnode.so'))
    outputs.file(new File(nodeMobileRoot, 'include/node/node.h'))

    doLast {
        if (!nodeMobileZip.isFile()) {
            nodeMobileZip.parentFile.mkdirs()
            def url = new URL("https://github.com/capawesome-team/nodejs-mobile/releases/download/v${nodeMobileVersion}/nodejs-mobile-v${nodeMobileVersion}-android.zip")
            url.withInputStream { input ->
                nodeMobileZip.withOutputStream { output -> output << input }
            }
        }

        def digest = java.security.MessageDigest.getInstance('SHA-256')
        nodeMobileZip.withInputStream { input ->
            byte[] buffer = new byte[8192]
            int read
            while ((read = input.read(buffer)) >= 0) {
                digest.update(buffer, 0, read)
            }
        }
        def actualSha256 = digest.digest().encodeHex().toString().toUpperCase()
        if (actualSha256 != nodeMobileSha256) {
            nodeMobileZip.delete()
            throw new GradleException("nodejs-mobile runtime SHA-256 mismatch: ${actualSha256}")
        }

        if (!new File(nodeMobileRoot, 'bin/arm64-v8a/libnode.so').isFile()) {
            delete nodeMobileRoot
            copy {
                from zipTree(nodeMobileZip)
                into nodeMobileRoot
            }
        }
    }
}

// Android's adb client already implements TLS pairing, SPAKE2 and the ADB
// transport. PickPico owns discovery, policy and its capability surface; this
// pinned Apache-2.0 engine remains a replaceable implementation detail.
tasks.register('preparePicoAdbEngine') {
    outputs.file(adbEngineFile)

    doLast {
        if (!adbEngineFile.isFile()) {
            adbEngineFile.parentFile.mkdirs()
            def url = new URL("https://github.com/che2n3jigw/aosp-adb-arm64/releases/download/${adbEngineVersion}/adb_arm64")
            url.withInputStream { input ->
                adbEngineFile.withOutputStream { output -> output << input }
            }
        }

        def digest = java.security.MessageDigest.getInstance('SHA-256')
        adbEngineFile.withInputStream { input ->
            byte[] buffer = new byte[8192]
            int read
            while ((read = input.read(buffer)) >= 0) {
                digest.update(buffer, 0, read)
            }
        }
        def actualSha256 = digest.digest().encodeHex().toString().toUpperCase()
        if (actualSha256 != adbEngineSha256) {
            adbEngineFile.delete()
            throw new GradleException("PicoADB engine SHA-256 mismatch: ${actualSha256}")
        }
    }
}

android {
    namespace 'com.mcpocket.poc'
    compileSdk 35
    ndkVersion '27.3.13750724'

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    packagingOptions {
        jniLibs {
            // PicoADB executes adb from nativeLibraryDir. The library must be
            // extracted as a real executable file rather than mmap'd from APK.
            useLegacyPackaging = true
        }
    }

    defaultConfig {
        applicationId 'com.mcpocket.poc'
        minSdk 26
        targetSdk 35
        versionCode 142
        versionName '0.17.16'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared', "-DNODE_MOBILE_ROOT=${nodeMobileRoot.absolutePath.replace('\\', '/')}"
            }
        }
    }

    signingConfigs {
        debug {
            if (pickpicoDebugKeystore) {
                storeFile file(pickpicoDebugKeystore)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        preview {
            initWith debug
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            debuggable true
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            jniLibs.srcDirs "${nodeMobileRoot.absolutePath}/bin", adbEngineRoot
            assets.srcDir layout.buildDirectory.dir('generated/dev-assets')
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}

tasks.register('installDevTools', Exec) {
    workingDir rootProject.file('devtools')
    def npmCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? ['cmd', '/c', 'npm'] : ['npm']
    commandLine npmCommand + ['ci', '--ignore-scripts', '--no-bin-links', '--no-audit', '--no-fund']
    inputs.files(rootProject.file('devtools/package.json'), rootProject.file('devtools/package-lock.json'))
    outputs.dir(rootProject.file('devtools/node_modules'))
}

tasks.register('prepareDevTools', Zip) {
    dependsOn tasks.named('installDevTools')
    from(rootProject.file('devtools')) {
        include 'runner.cjs', 'package.json', 'package-lock.json', 'node_modules/**'
    }
    archiveFileName = 'devtools.zip'
    destinationDirectory = layout.buildDirectory.dir('generated/dev-assets')
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareNodeMobileRuntime')
    dependsOn tasks.named('preparePicoAdbEngine')
    dependsOn tasks.named('prepareDevTools')
}

tasks.configureEach { task ->
    if (task.name.contains('CMake') || task.name.contains('NativeLib')) {
        task.dependsOn tasks.named('prepareNodeMobileRuntime')
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.json:json:20250517'
}
